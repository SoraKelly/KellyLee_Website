    <div id="imageModal" class="modal" aria-hidden="true">
        <button class="modalClose" type="button" aria-label="Close image">×</button>
        <button class="modalNav prev" type="button" aria-label="Previous image">←</button>
        <div class="modalContent">
            <img id="modalImage" src="" alt="">
            <p id="modalCaption"></p>
        </div>
        <button class="modalNav next" type="button" aria-label="Next image">→</button>
    </div>

    <div class = "cuteFooter">

    </div>


    <script>
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalCaption = document.getElementById('modalCaption');
        const closeButton = document.querySelector('.modalClose');
        const prevButton = document.querySelector('.modalNav.prev');
        const nextButton = document.querySelector('.modalNav.next');
        const galleryItems = Array.from(document.querySelectorAll('.item'));
        let currentIndex = 0;

        function closeModal() {
            modal.classList.remove('open');
            modal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modalOpen');
        }

        function showImage(index) {
            currentIndex = index;
            const item = galleryItems[currentIndex];
            if (!item) return;
            modalImage.src = item.dataset.src;
            modalImage.alt = item.dataset.title;
            modalCaption.textContent = item.dataset.title;
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modalOpen');
        }

        galleryItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                showImage(index);
            });
        });

        prevButton.addEventListener('click', () => {
            const prevIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            showImage(prevIndex);
        });

        nextButton.addEventListener('click', () => {
            const nextIndex = (currentIndex + 1) % galleryItems.length;
            showImage(nextIndex);
        });

        closeButton.addEventListener('click', closeModal);

        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            } else if (event.key === 'ArrowLeft') {
                const prevIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
                showImage(prevIndex);
            } else if (event.key === 'ArrowRight') {
                const nextIndex = (currentIndex + 1) % galleryItems.length;
                showImage(nextIndex);
            }
        });
    </script>
