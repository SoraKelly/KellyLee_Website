<!DOCTYPE html>
<html>

<head>
    <title> Contact Me </title>
    <link rel="stylesheet" href="../css/contact.css" media="all">
</head>
    <body>
    <header>
        <img src="../images/homepage/iconAebsite.png" alt="Kelly Lee Logo" class="logoImage">
        <div class="headerNavContainer">
            <nav>
                <a href="../index.html">Home</a>
                <a href="art.html">Art</a>
                <a href="code.html">Code</a>
                <a href="contact.html">Contact Me</a>
            </nav>
        </div>
    </header>
        <!--Contact Me Section-->
        <div id="contactMeSection" class = "contactMeContainer">
            <div class="contactMeGrid">
                <div class="contactMeIntro">
                    <h1> Contact Me </h1>
                    <p> If you have any inquiries about my work, please feel free to contact me.</p>
                    <div class = "socialMediaLinks">
                        <a href = "https://www.linkedin.com/in/kelly-lee-045825250/"> LinkedIn </a>
                        <a href = "Github"> Github </a>
                    </div>
                    <a href="../files/Kelly_Lee_Resume.pdf" download class="resumeButton">Download Resume</a>
                </div>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" 
                            name="name" 
                            placeholder="Your Name" required>
                        <span class="error-message" id="nameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" 
                            name="email" 
                            placeholder="Your Email" required>
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" 
                            name="phone" 
                            placeholder="Your Phone Number" required>
                        <span class="error-message" id="phoneError"></span>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" 
                                name="message" 
                                placeholder="Your Message" 
                                rows="5" required></textarea>
                        <span class="error-message" 
                            id="messageError"></span>
                    </div>
                    <button type="submit" 
                            class="submit-button">
                        Send
                    </button>
                </form>
            </div>
            <img src = "../images/homepage/pufferfooter.png" alt="Contact Me Footer" class="contactMeFooterImage">
        </div>

        <div class = "cuteFooter">
            <p>&copy; 2023 Contact Me. All rights reserved.</p>
        </div>

        <script>
            const recipientEmail = 'kellyjpntoys@gmail.com';
            const form = document.getElementById('contactForm');

            if (form) {
                form.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const name = form.name.value.trim();
                    const email = form.email.value.trim();
                    const phone = form.phone.value.trim();
                    const message = form.message.value.trim();

                    const subject = `Website Contact Form: ${name}`;
                    const body = [
                        `Name: ${name}`,
                        `Email: ${email}`,
                        `Phone: ${phone}`,
                        '',
                        'Message:',
                        message
                    ].join('\n');

                    window.location.href = `mailto:${recipientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                    form.reset();
                });
            }
        </script>
    </body>
</html>
